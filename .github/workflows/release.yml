name: LumaGate Release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

# Keep queued pushes, not only the last one. Never cancel an in-flight publish.
concurrency:
  group: lumagate-release
  cancel-in-progress: false
  queue: max

jobs:
  reserve:
    name: Reserve immutable version for source
    if: github.repository == 'Restry/LumaGate' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Only the reservation job and final publisher can write contents.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - id: version
        name: Reserve tag without creating a public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/releasing/release.py reserve

  build:
    name: Build ${{ matrix.platform }}
    needs: reserve
    if: needs.reserve.outputs.published != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 只发 macOS arm64 与 Windows x64/arm64。
        # macos-x64 曾是整条流水线的瓶颈（30 分钟以上），Linux 本产品不需要。
        include:
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: windows-arm64
            os: windows-2022
            target: aarch64-pc-windows-msvc
            bundles: nsis
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      VERSION: ${{ needs.reserve.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
      # Allows AppImage tooling to run on runners without mounting via FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Set up pinned pnpm on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Use a fresh prefix, not either preinstalled Node/Yarn shim directory.
          $prefix = Join-Path $env:RUNNER_TEMP 'lumagate-corepack'
          npm install --global --prefix $prefix corepack@0.34.6
          $corepack = Join-Path $prefix 'node_modules/corepack/dist/corepack.js'
          Write-Output "Corepack entry: $corepack"
          node $corepack enable --install-directory $prefix
          node $corepack install
          $env:PATH = "$prefix;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $prefix -Encoding utf8
          Get-Command node, corepack, pnpm | Select-Object Name, Source
          if ((corepack --version) -ne '0.34.6') { throw 'Wrong Corepack resolved' }
          if ((pnpm --version) -ne '10.12.3') { throw 'Wrong pnpm resolved' }
      - name: Set up pinned pnpm on Unix
        if: runner.os != 'Windows'
        run: |
          npm install --global corepack@0.34.6
          corepack enable
          corepack install
      - name: Verify package manager paths and set up Rust target
        run: |
          type -a node corepack pnpm
          corepack --version
          pnpm --version
          pnpm config set store-dir .pnpm-store
          rustup show active-toolchain
          rustup target add "$TARGET"
      - name: Verify Windows ARM64 compiler and linker early
        if: matrix.platform == 'windows-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $vs) { throw 'MSVC ARM64 build tools are missing' }
          Write-Output "ARM64 Visual Studio: $vs"
          $source = Join-Path $env:RUNNER_TEMP 'lumagate-arm64-toolchain.rs'
          $binary = Join-Path $env:RUNNER_TEMP 'lumagate-arm64-toolchain.exe'
          Set-Content -Path $source -Value 'fn main() {}'
          rustc --target $env:TARGET --crate-name arm64_toolchain $source -o $binary
          # Link only: an ARM64 executable cannot run on this x64 runner.
          Get-Item $binary | Select-Object Name, Length
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # 编译产物缓存是为了复用依赖编译，不是复用安装包。
          # 下一步会删掉所有 bundle 目录，确保安装包永远是本次编译出来的。
          path: |
            .pnpm-store
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: release-${{ matrix.platform }}-${{ hashFiles('pnpm-lock.yaml', 'src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            release-${{ matrix.platform }}-
      - name: Discard any cached installers before compiling
        run: rm -rf src-tauri/target/*/release/bundle src-tauri/target/release/bundle
      - name: Stamp build checkout only
        run: python scripts/releasing/release.py stamp --version "$VERSION"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned signature verifier
        run: python -m pip install cryptography==46.0.3
      - name: Build macOS installer with ad-hoc signature
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --ci --target "$TARGET" --bundles "$BUNDLES" -- --locked
      - name: Build unsigned Windows installers
        if: runner.os != 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --ci --target "$TARGET" --bundles "$BUNDLES" -- --locked
      - name: Verify native bundle metadata
        run: python scripts/releasing/verify_bundle.py --platform "$PLATFORM" --version "$VERSION"
      - name: Stage exact platform inventory
        run: python scripts/releasing/release.py stage --version "$VERSION" --platform "$PLATFORM" --output staged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installers-${{ matrix.platform }}
          path: staged/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          # These are temporary Actions artifacts, not public Release assets.
          # Supports rerun-failed-jobs alongside retained successful matrix jobs.
          overwrite: true

  publish:
    name: Verify all assets and publish once
    needs: [reserve, build]
    if: github.repository == 'Restry/LumaGate' && github.ref == 'refs/heads/release' && needs.reserve.outputs.published != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.reserve.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: installers-*
          path: artifacts
          merge-multiple: false
          digest-mismatch: error
      - name: Install pinned signature verifier
        run: python -m pip install cryptography==46.0.3
      - name: Validate complete matrix and generate checksums
        run: python scripts/releasing/release.py assemble --version "$VERSION" --input artifacts --output release-assets
      - name: Upload privately then promote complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/releasing/release.py publish --version "$VERSION" --input release-assets
      - name: Verify anonymous downloads and latest endpoint
        run: python scripts/releasing/release.py public --version "$VERSION" --input release-assets

  verify-existing:
    name: Verify published rerun without overwriting
    needs: reserve
    if: needs.reserve.outputs.published == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.reserve.outputs.version }}
      TAG: ${{ needs.reserve.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Download original published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo Restry/LumaGate --dir published
      - name: Install pinned signature verifier
        run: python -m pip install cryptography==46.0.3
      - name: Verify original source and every download
        run: python scripts/releasing/release.py verify --version "$VERSION" --input published
