name: LumaGate CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, release]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: App and release checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Set up pinned pnpm
        run: |
          # Node 22.12 bundles Corepack with obsolete npm signing keys.
          npm install --global corepack@0.34.6
          corepack enable
          corepack install
          pnpm config set store-dir .pnpm-store
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pnpm-store
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Validate release contracts
        run: |
          python scripts/releasing/release.py check
          python -m unittest discover -s scripts/releasing -p 'test_*.py' -v
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck active app
        run: pnpm typecheck
      - name: Test active gateway UI
        run: pnpm test:manual
